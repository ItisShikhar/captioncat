<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1120" width="1800" height="1120" role="img" aria-labelledby="title description">
  <title id="title">captioncat render request flow</title>
  <desc id="description">captioncat resolves a transcript and preset, generates raw in-memory caption frames, then writes PNG, standalone caption movie, and overlay video outputs through separate branches.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 400 34px Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 21px Arial, sans-serif; fill: #334155; }
      .label { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .body { font: 16px Arial, sans-serif; fill: #334155; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .box { stroke-width: 2; filter: url(#shadow); }
      .input { fill: #eff6ff; stroke: #60a5fa; }
      .resolve { fill: #f8fafc; stroke: #94a3b8; }
      .frames { fill: #dbeafe; stroke: #2563eb; }
      .png { fill: #fef3c7; stroke: #d97706; }
      .movie { fill: #dcfce7; stroke: #16a34a; }
      .overlay { fill: #f3e8ff; stroke: #9333ea; }
      .output { fill: #f8fafc; stroke: #64748b; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .dashed { stroke-dasharray: 10 8; }
      .note { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#ffffff"/>
  <text x="70" y="70" class="title">caption<tspan font-weight="700">cat</tspan> render request flow</text>
  <text x="70" y="105" class="body">Resolve the request once, then route raw caption frames to independent output sinks.</text>

  <text x="70" y="165" class="section">1. Resolve request</text>

  <rect x="70" y="195" width="260" height="125" rx="18" class="box input"/>
  <text x="200" y="235" text-anchor="middle" class="label">Input sources</text>
  <text x="200" y="264" text-anchor="middle" class="body">video, audio, captions,</text>
  <text x="200" y="288" text-anchor="middle" class="body">or prepared transcript</text>

  <rect x="390" y="195" width="260" height="125" rx="18" class="box resolve"/>
  <text x="520" y="235" text-anchor="middle" class="label">Transcript resolution</text>
  <text x="520" y="264" text-anchor="middle" class="body">select, parse, or transcribe</text>
  <text x="520" y="288" text-anchor="middle" class="body">one timed transcript</text>

  <rect x="710" y="195" width="260" height="125" rx="18" class="box resolve"/>
  <text x="840" y="235" text-anchor="middle" class="label">Preset loading</text>
  <text x="840" y="264" text-anchor="middle" class="body">load, validate, and merge</text>
  <text x="840" y="288" text-anchor="middle" class="body">render-level settings</text>

  <rect x="1030" y="195" width="300" height="125" rx="18" class="box resolve"/>
  <text x="1180" y="235" text-anchor="middle" class="label">ECS scene and layout</text>
  <text x="1180" y="264" text-anchor="middle" class="body">resolve entities, styles,</text>
  <text x="1180" y="288" text-anchor="middle" class="body">timing, canvas, and FPS</text>

  <path d="M330 257 H390" class="arrow"/>
  <path d="M650 257 H710" class="arrow"/>
  <path d="M970 257 H1030" class="arrow"/>

  <text x="70" y="395" class="section">2. Generate caption frames</text>
  <rect x="70" y="425" width="1260" height="145" rx="22" class="box frames"/>
  <text x="700" y="470" text-anchor="middle" class="label">Caption frame generation</text>
  <text x="700" y="505" text-anchor="middle" class="body">Paint each resolved caption frame as a raw RGBA buffer.</text>
  <text x="700" y="535" text-anchor="middle" class="body">Generate one buffer set at the render canvas size for PNG and standalone movie outputs.</text>
  <text x="700" y="558" text-anchor="middle" class="body">Use one stable content crop for caption-only outputs.</text>
  <path d="M1180 320 V425" class="arrow-blue"/>

  <text x="1380" y="395" class="section">3. Output branches</text>

  <rect x="1370" y="425" width="350" height="145" rx="22" class="box png"/>
  <text x="1545" y="470" text-anchor="middle" class="label">PNG encoder</text>
  <text x="1545" y="505" text-anchor="middle" class="body">Encode raw RGBA buffers</text>
  <text x="1545" y="535" text-anchor="middle" class="body">to a PNG sequence</text>

  <path d="M1330 470 H1370" class="arrow"/>
  <text x="1545" y="610" text-anchor="middle" class="small">PNG files are output sinks only.</text>
  <text x="1545" y="632" text-anchor="middle" class="small">No downstream branch reads them.</text>

  <rect x="70" y="670" width="390" height="145" rx="22" class="box movie"/>
  <text x="265" y="715" text-anchor="middle" class="label">FFmpeg stdin</text>
  <text x="265" y="750" text-anchor="middle" class="body">Stream raw RGBA buffers</text>
  <text x="265" y="780" text-anchor="middle" class="body">to the standalone caption movie encoder</text>
  <path d="M265 570 V670" class="arrow"/>

  <rect x="530" y="670" width="390" height="145" rx="22" class="box movie"/>
  <text x="725" y="715" text-anchor="middle" class="label">Standalone caption movie</text>
  <text x="725" y="750" text-anchor="middle" class="body">standaloneCaptionMovie output</text>
  <text x="725" y="780" text-anchor="middle" class="body">does not use PNG files</text>
  <path d="M460 742 H530" class="arrow"/>

  <rect x="990" y="670" width="730" height="145" rx="22" class="box overlay"/>
  <text x="1355" y="715" text-anchor="middle" class="label">Overlay frame source</text>
  <text x="1355" y="750" text-anchor="middle" class="body">Share the in-memory caption frames only when canvas size equals input video size</text>
  <text x="1355" y="780" text-anchor="middle" class="body">and render FPS equals overlay FPS. Otherwise generate overlay-specific frames.</text>
  <path d="M900 570 V625 H1355 V670" class="arrow"/>

  <rect x="990" y="895" width="350" height="125" rx="18" class="box overlay"/>
  <text x="1165" y="935" text-anchor="middle" class="label">Overlay Video Compositor</text>
  <text x="1165" y="964" text-anchor="middle" class="body">caption frames + source video</text>
  <text x="1165" y="991" text-anchor="middle" class="body">existing compositor branch</text>

  <rect x="1370" y="895" width="350" height="125" rx="18" class="box output"/>
  <text x="1545" y="935" text-anchor="middle" class="label">Overlay video</text>
  <text x="1545" y="964" text-anchor="middle" class="body">overlayVideo output</text>
  <text x="1545" y="991" text-anchor="middle" class="body">with source audio and video</text>

  <path d="M1355 815 V895" class="arrow"/>
  <path d="M1340 957 H1370" class="arrow"/>

  <rect x="70" y="895" width="850" height="125" rx="18" class="box note"/>
  <text x="495" y="932" text-anchor="middle" class="label">Independent output routing</text>
  <text x="495" y="962" text-anchor="middle" class="body">The PNG, standalone caption movie, and overlay branches receive raw in-memory data.</text>
  <text x="495" y="990" text-anchor="middle" class="body">The overlay branch stays separate from PNG writing and never reads PNG files.</text>
</svg>
